# Example floor plan for the terminal view (F8) and CAD export (./scada plan-dxf).
#
# Copy it and draw your own building:
#   cp plan.example.yaml plan.yaml
# Format: docs/06-floor-plan.md
#
# Dimensions in millimetres, origin in the top-left corner (as on a paper drawing).
#   x, y  = top-left corner of the room (inside dimensions)
#   w, h  = width and depth
#   label = text shown in the room
#   room  = name of the room in ETS – links temperature, lights and alarms to the room
#           (case does not matter). Leave it out for rooms without KNX.
#           The names below are examples: use the room names from F2 or ./scada info.
#
# Tip: leave a gap of about 150 mm between rooms for the walls.

floors:
  - name: "Ground floor"
    width: 9000
    depth: 7000
    rooms:
      - {label: "Kitchen", x: 200, y: 200, w: 3300, h: 3000, room: "Kitchen"}
      - {label: "Bathroom", x: 3650, y: 200, w: 2000, h: 3000, room: "Bathroom"}
      - {label: "Hall", x: 5800, y: 200, w: 1900, h: 3000, room: "Hall"}
      - {label: "Stairs", x: 7850, y: 200, w: 950, h: 3000}
      - {label: "Living room", x: 200, y: 3350, w: 8600, h: 3450, room: "Living room"}

  - name: "First floor"
    width: 9000
    depth: 7000
    rooms:
      - {label: "Bedroom 1", x: 200, y: 200, w: 4200, h: 3200, room: "Bedroom 1"}
      - {label: "Landing", x: 4550, y: 200, w: 4250, h: 3200, room: "Landing"}
      - {label: "Bedroom 2", x: 200, y: 3550, w: 4200, h: 3250, room: "Bedroom 2"}
      - {label: "Bedroom 3", x: 4550, y: 3550, w: 3500, h: 3250, room: "Bedroom 3"}
      - {label: "Closet", x: 8200, y: 3550, w: 600, h: 3250}

  - name: "Basement"
    width: 9000
    depth: 7000
    rooms:
      - {label: "Technical room", x: 250, y: 250, w: 4000, h: 3200, room: "Technical room"}
      - {label: "Storage", x: 250, y: 3600, w: 4000, h: 3150}
      - {label: "Crawl space", x: 4500, y: 250, w: 4250, h: 6500}
