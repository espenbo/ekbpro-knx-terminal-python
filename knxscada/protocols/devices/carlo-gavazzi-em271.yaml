# Carlo Gavazzi EM271: multi-channel power analyzer (2 × 3-phase or 6 × 1-phase loads) with two blocks of
# split-core current sensors, TCDA1 and TCDA2 (TCD0M–TCD3M, 60–400 A, primary current detected automatically)
# – Modbus RTU on RS485.
# Source: "EM271 Communication Protocol", version 0 revision 0 (2014-05-12), tables 2.3-1, 2.6-1, 2.7-3, 2.7-9.
# Values are integers with a value weight (V×10, A×1000, W×10, kWh×10); INT32 has the low word first.
# The system values (A L1 Σ … VA MAXDMD Σ at 000Ch–0022h) exist only with SUM on, so the template reads the
# values of each sensor block. Tag names are written as in the manual (TCDA1 = first block, TCDA2 = second);
# give them names from your tagging system in the gateway.
manufacturer: Carlo Gavazzi
protocol: modbus
models:
  EM271: multi-channel power analyzer with TCD_M current sensor blocks up to 400 A (MV5/MV6, 2S/OS)
manual: EM271 Communication Protocol, version 0 revision 0
links:
  - https://www.gavazzi.no/produktutvelgelse/energimaler-em27172dmv53x2sx/

# Factory setting: 9600 baud, no parity, 1 stop bit (8N1). At most 18 registers per request.
settings:
  transport: rtu
  baudrate: '9600'
  parity: N
  stopbits: '1'
  unit_id: 1
  poll_ms: 5000
  word_order: little
  max_registers: 18

identify:
  meter_code: {address: 'hr:0x000B', type: uint16,
               values: {274: EM271, 275: EM271, 276: EM271, 277: EM271}}
  unit_id: {address: 'hr:0x2000', type: uint16}
  baudrate: {address: 'hr:0x2001', type: uint16, values: {0: '9600', 1: '19200', 2: '38400'}}
  parity: {address: 'hr:0x2002', type: uint16, values: {0: N, 1: E}}

# "EEE" (overflow): MSW 7FFFh.
invalid: [2147483647]

tags:
  V L1-N: {address: 'hr:0x0000', type: int32, scale: 0.1, unit: V, writable: false}
  V L2-N: {address: 'hr:0x0002', type: int32, scale: 0.1, unit: V, writable: false}
  V L3-N: {address: 'hr:0x0004', type: int32, scale: 0.1, unit: V, writable: false}
  V L1-L2: {address: 'hr:0x0006', type: int32, scale: 0.1, unit: V, writable: false}
  V L2-L3: {address: 'hr:0x0008', type: int32, scale: 0.1, unit: V, writable: false}
  V L3-L1: {address: 'hr:0x000A', type: int32, scale: 0.1, unit: V, writable: false}
  A L1 TCDA1: {address: 'hr:0x010C', type: int32, scale: 0.001, unit: A, writable: false}
  A L2 TCDA1: {address: 'hr:0x010E', type: int32, scale: 0.001, unit: A, writable: false}
  A L3 TCDA1: {address: 'hr:0x0110', type: int32, scale: 0.001, unit: A, writable: false}
  W L1 TCDA1: {address: 'hr:0x0112', type: int32, scale: 0.1, unit: W, writable: false}
  W L2 TCDA1: {address: 'hr:0x0114', type: int32, scale: 0.1, unit: W, writable: false}
  W L3 TCDA1: {address: 'hr:0x0116', type: int32, scale: 0.1, unit: W, writable: false}
  W TOT TCDA1: {address: 'hr:0x0118', type: int32, scale: 0.1, unit: W, writable: false}
  VA TOT TCDA1: {address: 'hr:0x011A', type: int32, scale: 0.1, unit: VA, writable: false}
  var TOT TCDA1: {address: 'hr:0x011C', type: int32, scale: 0.1, unit: var, writable: false}
  kWh (+) TOT TCDA1: {address: 'hr:0x011E', type: int32, scale: 0.1, unit: kWh, writable: false}
  kvarh (+) TOT TCDA1: {address: 'hr:0x0120', type: int32, scale: 0.1, unit: kvarh, writable: false}
  W TOT TCDA1 DMD: {address: 'hr:0x0122', type: int32, scale: 0.1, unit: W, writable: false}
  VA TOT TCDA1 DMD: {address: 'hr:0x0124', type: int32, scale: 0.1, unit: VA, writable: false}
  W TOT TCDA1 MAXDMD: {address: 'hr:0x0126', type: int32, scale: 0.1, unit: W, writable: false}
  VA TOT TCDA1 MAXDMD: {address: 'hr:0x0128', type: int32, scale: 0.1, unit: VA, writable: false}
  kWh (+) L1 TCDA1: {address: 'hr:0x012A', type: int32, scale: 0.1, unit: kWh, writable: false}
  kWh (+) L2 TCDA1: {address: 'hr:0x012C', type: int32, scale: 0.1, unit: kWh, writable: false}
  kWh (+) L3 TCDA1: {address: 'hr:0x012E', type: int32, scale: 0.1, unit: kWh, writable: false}
  A L1 TCDA2: {address: 'hr:0x020C', type: int32, scale: 0.001, unit: A, writable: false}
  A L2 TCDA2: {address: 'hr:0x020E', type: int32, scale: 0.001, unit: A, writable: false}
  A L3 TCDA2: {address: 'hr:0x0210', type: int32, scale: 0.001, unit: A, writable: false}
  W L1 TCDA2: {address: 'hr:0x0212', type: int32, scale: 0.1, unit: W, writable: false}
  W L2 TCDA2: {address: 'hr:0x0214', type: int32, scale: 0.1, unit: W, writable: false}
  W L3 TCDA2: {address: 'hr:0x0216', type: int32, scale: 0.1, unit: W, writable: false}
  W TOT TCDA2: {address: 'hr:0x0218', type: int32, scale: 0.1, unit: W, writable: false}
  VA TOT TCDA2: {address: 'hr:0x021A', type: int32, scale: 0.1, unit: VA, writable: false}
  var TOT TCDA2: {address: 'hr:0x021C', type: int32, scale: 0.1, unit: var, writable: false}
  kWh (+) TOT TCDA2: {address: 'hr:0x021E', type: int32, scale: 0.1, unit: kWh, writable: false}
  kvarh (+) TOT TCDA2: {address: 'hr:0x0220', type: int32, scale: 0.1, unit: kvarh, writable: false}
  W TOT TCDA2 DMD: {address: 'hr:0x0222', type: int32, scale: 0.1, unit: W, writable: false}
  VA TOT TCDA2 DMD: {address: 'hr:0x0224', type: int32, scale: 0.1, unit: VA, writable: false}
  W TOT TCDA2 MAXDMD: {address: 'hr:0x0226', type: int32, scale: 0.1, unit: W, writable: false}
  VA TOT TCDA2 MAXDMD: {address: 'hr:0x0228', type: int32, scale: 0.1, unit: VA, writable: false}
  kWh (+) L1 TCDA2: {address: 'hr:0x022A', type: int32, scale: 0.1, unit: kWh, writable: false}
  kWh (+) L2 TCDA2: {address: 'hr:0x022C', type: int32, scale: 0.1, unit: kWh, writable: false}
  kWh (+) L3 TCDA2: {address: 'hr:0x022E', type: int32, scale: 0.1, unit: kWh, writable: false}
  # Primary current of the sensor block, detected by the meter; 65535 = no TCD connected.
  TCDA1 CT primary: {address: 'hr:0x1003', type: uint16, unit: A, writable: false, invalid: [65535]}
  TCDA2 CT primary: {address: 'hr:0x1004', type: uint16, unit: A, writable: false, invalid: [65535]}
