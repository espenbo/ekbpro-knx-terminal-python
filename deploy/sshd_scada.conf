# Optional: a dedicated SSH user that goes straight into the SCADA view.
#
# Replace INSTALL_DIR (the folder with ./scada) and YOUR_USER (the owner of the program), e.g.:
#   sudo useradd -m -s /bin/bash -G YOUR_USER scada  # the group gives access to the socket
#   sudo passwd scada                                 # or add a key to ~scada/.ssh/authorized_keys
#   sed "s#INSTALL_DIR#$PWD#g" deploy/sshd_scada.conf | sudo tee /etc/ssh/sshd_config.d/scada.conf
#   sudo systemctl reload ssh
#
# Then: ssh scada@<server>
# The user only gets the visualisation. When the TUI exits, the session is closed.

Match User scada
    ForceCommand INSTALL_DIR/scada tui
    PermitTTY yes
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
