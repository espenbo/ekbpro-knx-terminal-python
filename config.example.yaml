# EKBPRO KNX Terminal Python – configuration template
#
# Create your own config.yaml from this file with:
#   ./scada init MyProject.knxproj --gateway 192.168.1.50 [--language nb]
# or copy it and edit it by hand (replace the __PLACEHOLDERS__).
# Relative paths are resolved from the directory config.yaml is in.
# Full reference: docs/04-configuration.md

knx:
  # tunneling | tunneling_tcp | routing | automatic
  # tunneling_secure | routing_secure  (KNX IP Secure – needs the keyring below)
  connection: __CONNECTION__
  gateway_ip: __GATEWAY__
  gateway_port: 3671
  # local_ip: 192.168.1.10          # set when the machine has several network interfaces
  # route_back: true                # interface reached through NAT/VPN (Tailscale, WireGuard)
  # individual_address: 1.1.250     # routing only
  # KNX Secure: export the keyring from ETS (Project → Security → Export keyring)
  # keyring_file: MyProject.knxkeys
  # keyring_password: "secret"
  # user_id: 2                      # tunnel user for secure tunneling (optional)
  # Several KNX IP interfaces (one per line/building part): list them under interfaces instead.
  # Keys above are then defaults for every interface. See docs/04-configuration.md.
  # interfaces:
  #   - name: house
  #     gateway_ip: 192.168.1.50
  #     default: true
  #   - name: garage
  #     gateway_ip: 192.168.1.51
  #     addresses: ["4/*"]          # group addresses sent through this interface
  #     # project: annex            # with several ETS projects: the project of this interface's bus
  # dedup_ms: 1000                  # copies of a telegram from another interface within this time are dropped

project:
  file: __PROJECT__
  # password: ""                    # if the .knxproj is password protected
  # (.knxprojarchive from ETS 6 works too)
  # Several ETS projects in one site instead of file: (see docs/04-configuration.md):
  # files:
  #   - {name: main, label: Main building, file: Main.knxproj}
  #   - {name: annex, label: Annex, prefix: S, file: Annex.knxprojarchive}   # addresses become S:1/2/3
  # Rooms from the group address names, for projects structured by function:
  # rooms:
  #   pattern: "(?i)\\b(office\\s*\\d+|kitchen|meeting room)\\b"
  #   floors: {0: "1st floor", 1: "2nd floor"}   # main group → floor
  cache: var/project_cache.json     # rebuilt automatically when the .knxproj changes

server:
  socket: var/knxscada.sock
  database: var/knxscada.db
  retention_days: 90                # how long telegrams and events are kept
  # Read values from the bus when the server starts: false (default, sends no telegrams),
  # status (feedback/sensor/alarm addresses only) or all (also control addresses – not recommended,
  # a stale answer from another device can switch actuators). See docs/04-configuration.md.
  read_on_start: false
  read_interval_ms: 80              # pause between reads (keeps the bus load low)

# Alarms: rules select group addresses by address (glob) and/or name (regex).
# The first matching rule applies. condition: "true" | "false" | "> 30" | "< 5" | ">= x" | "<= x" | "== x" | "!= x"
# severity: critical | warning (other text is allowed and shown as-is)
# The rules below are generic and rely on words in the group address names
# (English and Norwegian) – adapt them to your project.
alarms:
  - match_name: "(?i)(røyk|smoke|brann|fire).*(alarm)|(alarm).*(røyk|smoke|brann)"
    exclude_name: "(?i)acknowledg|kvitter|reset|test"
    dpt_main: 1
    condition: "true"
    severity: critical
    text: "Fire/smoke: {name}"
  - match_name: "(?i)(vann|water|lekk|leak).*(alarm|sensor|føler)"
    dpt_main: 1
    condition: "true"
    severity: critical
    text: "Water leak: {name}"
  - match_name: "(?i)\\b(alarm|feil|fault|failure|malfunction|error|kortslutning|short|overlast|overload|batteri|battery)\\b"
    exclude_name: "(?i)acknowledg|kvitter|reset|test|grense|limit"
    dpt_main: 1
    condition: "true"
    severity: warning
    text: "{name}"
  - match_name: "(?i)temp"
    exclude_name: "(?i)ute|outdoor|setpoint|setpunkt|skal|ønsket"
    dpt_main: 9
    condition: "> 30"
    severity: warning
    text: "High temperature: {name} = {value}"

ui:
  title: __TITLE__
  # User interface language: en (English) | nb (Norwegian bokmål).
  # Each user can choose their own with Ctrl+L (saved in ~/.config/knxscada/ui.json),
  # and ./scada tui --language nb overrides it for one session.
  language: __LANGUAGE__
  # Colour theme: retro | retro-classic | amber | modern | solarized
  # (each user can choose their own with Ctrl+T – saved in ~/.config/knxscada/ui.json)
  theme: retro
  splash: true                      # start-up splash screen
  big_digits: false                 # big block digits in status tiles/screensaver
  ascii: false                      # ASCII-only charts (old terminals without Unicode)
  screensaver_minutes: 5            # 0 = off
  screensaver_rotate_s: 20
  # plan: plan.yaml                 # floor plan (see docs/06-floor-plan.md)
  # outdoor_ga: 0/1/0               # status tiles – found automatically by name if not set
  # power_ga: 0/0/23
  # energy_ga: 0/1/20
  setpoint_step: 0.5                # °C per press on − / +
  dim_step: 10                      # % per press on − / +
  confirm_raw_write: true           # confirm writes from the group address view

# PLC bridge over OPC UA (optional) – exchange KNX values with a PLC, e.g. CODESYS on a WAGO PFC.
# 1. ./scada plc-map           → plc_map.yaml (mark addresses with use: true) and GVL_KNX.st
# 2. Import GVL_KNX.st into the PLC project, add it to the Symbol Configuration, download.
# 3. Set enabled: true and restart the server.            Guide: docs/10-plc-opcua.md
plc:
  enabled: false
  endpoint: opc.tcp://127.0.0.1:4840   # the PLC's OPC UA server (127.0.0.1 when running on the PLC itself)
  # username: knx                      # empty = anonymous
  # password: "secret"
  # security: Aes128Sha256RsaOaep,SignAndEncrypt   # None | <policy>,Sign | <policy>,SignAndEncrypt
  #                                    # policy: Basic256Sha256 | Aes128Sha256RsaOaep | Aes256Sha256RsaPss
  # certificate: var/opcua/client_cert.der   # client certificate, created automatically – trust it in the PLC
  # private_key: var/opcua/client_key.pem
  # server_certificate: var/opcua/plc_cert.der   # pin the PLC's certificate (recommended with security)
  map: plc_map.yaml                    # which group addresses, direction and PLC variable names
  # gvl: GVL_KNX                       # name of the GVL (when plc_map.yaml is first created)
  # tag_prefix: BY1234                 # name variables after system tags of PLC objects in ETS
  # gvl_file: GVL_KNX.st               # where plc-map writes the CODESYS GVL
  # node_prefix: "|var|WAGO 750-8302 PFC300 2ETH RS.Application.GVL_KNX."   # found automatically if not set
  # namespace: 4                       # with node_prefix: namespace index of the PLC variables
  publish_interval_ms: 200             # how fast PLC changes are reported
  min_interval_ms: 200                 # at most one KNX write per address in this time (latest value wins)
  # PLC restart (download/reset) protection – see docs/10-plc-opcua.md:
  # settle_ms: 500                     # PLC changes are held this long before they go to KNX
  # burst_limit: 8                     # more changes than this at once = PLC restart: nothing is sent
  # restart_quiet_s: 15                # after a restart: only remember values, then re-sync the PLC from KNX
